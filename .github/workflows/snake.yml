name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # todo dia à meia-noite (UTC)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar animação da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Cores personalizáveis: color_snake = cobrinha, color_dots = quadrados (do vazio ao mais cheio)
          outputs: |
            dist/github-snake.svg?color_snake=#2c5364&color_dots=#ebedf0,#b8e3f5,#7dcdef,#36bcf7,#1a8fc2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#36bcf7&color_dots=#161b22,#1b4b5a,#26708a,#36a0c4,#36bcf7

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
