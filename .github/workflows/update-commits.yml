name: Atualizar commits recentes

on:
  schedule:
    - cron: "0 */6 * * *" # a cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Buscar commits reais e atualizar o README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: |
          gh api "search/commits?q=author:${USER_NAME}&sort=author-date&order=desc&per_page=5" \
            --jq '.items[] | "- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0]) — **\(.repository.full_name)**"' > commits.md

          python3 - <<'EOF'
          import re

          readme = open("README.md", encoding="utf-8").read()
          block = open("commits.md", encoding="utf-8").read().strip()
          if block:
              readme = re.sub(
                  r"(<!--START_COMMITS-->).*?(<!--END_COMMITS-->)",
                  lambda m: f"{m.group(1)}\n{block}\n{m.group(2)}",
                  readme,
                  flags=re.S,
              )
              open("README.md", "w", encoding="utf-8").write(readme)
          EOF

          rm commits.md

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: atualiza commits recentes" && git push)
